name: Bug report
description: Something went wrong while scanning or slimming an app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If an optimized app fails to launch, this is the right place.
        For security vulnerabilities, please follow the [security policy](../../security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open MonoSlice
        2. Select ...
        3. Click Optimize
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Affected app
      description: Name and version of the app you were slimming, if any.
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Mac app
        - Command-line tool (monoslice)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MonoSlice version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Pro M3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: For the CLI, run with `--verbose` and paste the output.
      render: shell
